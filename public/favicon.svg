<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Outer Ribbon Main Gradient -->
    <linearGradient id="fav-ribbon-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#052866" />
      <stop offset="35%" stop-color="#0a58ca" />
      <stop offset="70%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#00a6ff" />
    </linearGradient>

    <!-- Top Curve Ribbon Highlight -->
    <linearGradient id="fav-top-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#0047cc" />
    </linearGradient>

    <!-- Inner Fold Shadow -->
    <linearGradient id="fav-ribbon-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b4d" />
      <stop offset="100%" stop-color="#093d9e" />
    </linearGradient>

    <!-- Growth Arrow Green Gradient -->
    <linearGradient id="fav-arrow-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#00c853" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="fav-coin-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#00c853" />
      <stop offset="100%" stop-color="#008c3a" />
    </linearGradient>

    <!-- Coin Stack Rim Gradient -->
    <linearGradient id="fav-coin-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2fbeb" />
      <stop offset="100%" stop-color="#00a854" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="fav-play-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="fav-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0a2568" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Glow & Base for Favicon clarity -->
  <g filter="url(#fav-shadow)">
    <!-- 3D Ribbon Letter "E" Shape -->
    <!-- Inner Dark Fold / Shadow Layer -->
    <path 
      d="M 50 145 C 45 105, 75 55, 125 45 C 160 38, 190 55, 195 75 L 155 90 C 145 75, 125 70, 105 78 C 80 88, 72 115, 75 145 Z" 
      fill="url(#fav-ribbon-shadow)"
    />

    <!-- Main Outer Ribbon Body (curves around left from bottom to top) -->
    <path 
      d="M 60 215 C 25 185, 20 115, 45 65 C 65 25, 120 15, 175 22 C 190 24, 205 32, 215 42 L 180 82 C 160 65, 125 60, 95 72 C 65 85, 55 120, 60 160 C 65 195, 95 218, 135 218 C 160 218, 180 208, 195 192 L 195 218 C 175 235, 145 242, 115 242 C 85 242, 68 230, 60 215 Z" 
      fill="url(#fav-ribbon-blue)"
    />

    <!-- Top Cyan Ribbon Fold -->
    <path 
      d="M 120 18 C 160 18, 198 28, 222 45 L 182 82 C 165 70, 145 64, 122 64 C 98 64, 82 72, 75 82 C 68 55, 90 25, 120 18 Z" 
      fill="url(#fav-top-cyan)"
    />

    <!-- Bottom Left Swoop -->
    <path 
      d="M 38 152 C 34 185, 52 215, 82 232 C 112 248, 150 245, 180 228 L 195 210 C 170 226, 135 230, 105 220 C 75 210, 58 185, 56 155 Z" 
      fill="#052866"
      opacity="0.7"
    />

    <!-- Play Button Triangle (Upper negative space) -->
    <path 
      d="M 122 88 C 122 84, 126 82, 130 84 L 176 112 C 180 114, 180 120, 176 122 L 130 150 C 126 152, 122 150, 122 146 Z" 
      fill="url(#fav-play-blue)"
    />

    <!-- Rising Green Growth Arrow (Middle swoop piercing up-right) -->
    <!-- Arrow Tail / Ribbon Path -->
    <path 
      d="M 72 205 C 105 185, 140 155, 182 118 L 192 128 L 222 82 L 165 92 L 175 102 C 135 138, 100 168, 68 188 Z" 
      fill="url(#fav-arrow-green)"
    />

    <!-- Monetization Coins Stack (Bottom-Right) -->
    <!-- Coin 3 (Bottom) -->
    <ellipse cx="188" cy="222" rx="22" ry="7" fill="#008040" />
    <path d="M 166 222 L 166 226 C 166 230, 210 230, 210 226 L 210 222 Z" fill="#006030" />
    
    <!-- Coin 2 (Middle) -->
    <ellipse cx="188" cy="214" rx="22" ry="7" fill="#00a854" />
    <path d="M 166 214 L 166 218 C 166 222, 210 222, 210 218 L 210 214 Z" fill="#007a3d" />

    <!-- Coin 1 (Top Flat of Stack) -->
    <ellipse cx="188" cy="206" rx="22" ry="7" fill="url(#fav-coin-rim)" />
    <ellipse cx="188" cy="205" rx="20" ry="6" fill="#00c853" />

    <!-- Front Tilted Dollar Coin -->
    <circle cx="212" cy="216" r="24" fill="url(#fav-coin-green)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Inner Dollar Sign ($) -->
    <text 
      x="212" 
      y="224" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="24" 
      font-weight="900" 
      fill="#ffffff" 
      text-anchor="middle"
    >$</text>
  </g>
</svg>
